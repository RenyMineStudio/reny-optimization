# Reny Optimization build identity
modName = Reny Optimization
modId = renyoptimization
modGroup = dev.reny.optimization
useModGroupForPublishing = true

# Keep build scripts pinned and review upgrades deliberately.
autoUpdateBuildScript = false
gtnh.settings.blowdryerTag = 0.2.2

# Minecraft / Forge target
minecraftVersion = 1.7.10
forgeVersion = 10.13.4.1614
channel = stable
mappingsVersion = 12
remoteMappings = https\://raw.githubusercontent.com/MinecraftForge/FML/1.7.10/conf/
developmentEnvironmentUserName = Developer

# Reny deliberately uses real Java 8 language semantics and Java 8 bytecode.
enableModernJavaSyntax = false
enableGenericInjection = true

# Generated build token class used by the @Mod entrypoint.
generateGradleTokenClass = dev.reny.optimization.Tags
gradleTokenVersion = VERSION
replaceGradleTokenInFile =
apiPackage =

# Transformation stack. UniMixins is wired by the GTNH convention when usesMixins=true.
accessTransformersFile =
usesMixins = true
separateMixinSourceSet =
usesMixinDebug = false
mixinPlugin =
# Relative to modGroup, so this resolves to dev.reny.optimization.mixin.
mixinsPackage = mixin
coreModClass =
containsMixinsAndOrCoreModOnly = false
forceEnableMixins = false

# Dependency / packaging policy
usesShadowedDependencies = false
minimizeShadowedDependencies = true
relocateShadowedDependencies = true
includeWellKnownRepositories = true
excludeWellKnownRepositories =
usesMavenPublishing = false
modrinthProjectId =
modrinthRelations =
curseForgeProjectId =
curseForgeRelations =

# Gradle runtime behavior
org.gradle.configuration-cache = true
org.gradle.parallel = true
