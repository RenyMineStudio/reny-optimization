name: Patch Registry

on:
  push:
    paths:
      - 'src/main/java/dev/reny/optimization/patch/**'
      - 'src/test/java/dev/reny/optimization/patch/**'
      - 'tools/test-patch-registry.sh'
      - '.github/workflows/patch-registry.yml'
  pull_request:
    paths:
      - 'src/main/java/dev/reny/optimization/patch/**'
      - 'src/test/java/dev/reny/optimization/patch/**'
      - 'tools/test-patch-registry.sh'
      - '.github/workflows/patch-registry.yml'

jobs:
  registry-self-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Compile and run registry tests
        run: sh tools/test-patch-registry.sh
