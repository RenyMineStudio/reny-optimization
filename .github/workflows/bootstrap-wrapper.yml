name: Bootstrap Gradle Wrapper

on:
  push:
    branches: [ issue-2-forge-rfg-bootstrap ]

permissions:
  contents: write

concurrency:
  group: issue-2-wrapper-bootstrap
  cancel-in-progress: true

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Gradle runtime JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate standard Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          pushd "$tmp"
          printf 'rootProject.name = "wrapper-bootstrap"\n' > settings.gradle
          gradle wrapper --gradle-version 9.3.1 --distribution-type bin
          popd
          mkdir -p gradle/wrapper
          cp "$tmp/gradlew" ./gradlew
          cp "$tmp/gradlew.bat" ./gradlew.bat
          cp "$tmp/gradle/wrapper/gradle-wrapper.jar" ./gradle/wrapper/gradle-wrapper.jar
          cp "$tmp/gradle/wrapper/gradle-wrapper.properties" ./gradle/wrapper/gradle-wrapper.properties
          chmod +x ./gradlew

      - name: Commit generated wrapper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          if ! git diff --cached --quiet; then
            git commit -m 'build: add Gradle 9.3.1 wrapper'
            git push origin HEAD:issue-2-forge-rfg-bootstrap
          fi

      - name: Build Forge mod
        run: ./gradlew build --stacktrace

      - name: Verify Java 8 bytecode
        shell: bash
        run: |
          set -euo pipefail
          class_file="build/classes/java/main/dev/reny/optimization/RenyOptimization.class"
          test -f "$class_file"
          javap -verbose "$class_file" | grep -q 'major version: 52'

      - name: Verify development tasks
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew tasks --all > build/task-list.txt
          grep -q 'runClient' build/task-list.txt
          grep -q 'runServer' build/task-list.txt
          grep -q 'setupDecompWorkspace' build/task-list.txt
