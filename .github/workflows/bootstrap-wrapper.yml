name: Bootstrap Forge Validation

on:
  push:
    branches: [ issue-2-forge-rfg-bootstrap ]

permissions:
  contents: write

concurrency:
  group: issue-2-forge-bootstrap
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Gradle runtime JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply repository formatting
        run: ./gradlew spotlessApply --stacktrace

      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          if ! git diff --cached --quiet; then
            git commit -m 'style: apply GTNH formatting'
            git push origin HEAD:issue-2-forge-rfg-bootstrap
          fi

      - name: Build and reobfuscate Forge mod
        run: ./gradlew build --stacktrace

      - name: Verify Java 8 bytecode
        shell: bash
        run: |
          set -euo pipefail
          class_file="build/classes/java/main/dev/reny/optimization/RenyOptimization.class"
          test -f "$class_file"
          javap -verbose "$class_file" | grep -q 'major version: 52'

      - name: Verify development tasks
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew tasks --all > build/task-list.txt
          grep -q 'runClient' build/task-list.txt
          grep -q 'runServer' build/task-list.txt
          grep -q 'setupDecompWorkspace' build/task-list.txt

      - name: Verify UniMixins runtime dependency
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew dependencies --configuration runtimeClasspath > build/runtime-dependencies.txt
          grep -qi 'unimixins' build/runtime-dependencies.txt

      - name: Verify packaged mod
        shell: bash
        run: |
          set -euo pipefail
          jar_file="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -n 1)"
          test -n "$jar_file"
          jar tf "$jar_file" | grep -q '^mcmod.info$'
          jar tf "$jar_file" | grep -q '^dev/reny/optimization/RenyOptimization.class$'
